<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello in Css</title>
    <style>
        h2 {
            color: rgb(0, 255, 140);
        }
        p {
            color: rgb(255, 0, 140);
        }
    </style>
    <link rel="stylesheet" href="01_hello_css.css">
</head>
<body>
    <h1>Maneras de incluir Estilos en CSS en un archivo HTML</h1>
    <h1 style="color: rgb(140, 0, 255)">Hello World con Css - Tipo Inline</h1>
    <h2>Estilos CSS - Interno</h2>
    <p>Esta es la manera de incluir estilos tipo interno, colocando los estilos en el head del HTML</p>
    <h3>Estilos CSS - Externo</h3>
    <a>Se incluyo estilo a travez de un archivo externo</a>

</body>
</html>
