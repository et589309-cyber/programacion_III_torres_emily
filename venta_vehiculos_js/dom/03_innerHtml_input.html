<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>innerHTML</title>
</head>
<body>
    <h1>Vehículo destacado</h1>
    <div id="caja"></div>

    <script>
        let caja = document.getElementById('caja');
        caja.innerHTML = '<h2>Toyota Corolla</h2><p>Precio: $18.500</p>';
    </script>
</body>
</html>
