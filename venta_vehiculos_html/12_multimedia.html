<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia - Venta de vehículos</title>
</head>
<body>
    <h1>Multimedia de la concesionaria</h1>
    <h2>Presentación del vehículo</h2>
    <video controls width="320" poster="imagenes/sedan.svg">
    <source src="multimedia/vehiculo.mp4" type="video/mp4">Tu navegador no admite video.</video>
    <h2>Audio de presentación</h2>
    <audio controls>
    <source src="multimedia/presentacion.wav" type="audio/wav">Tu navegador no admite audio.</audio>
    <p>Recursos multimedia de demostración.</p>
</body>
</html>
