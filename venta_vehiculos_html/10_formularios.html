<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios - Venta de vehículos</title>
</head>
<body>
    <h1>Solicitud de información</h1>
    <form action="#" method="get">
    <p>
    <label for="nombre">Nombre:</label> <input id="nombre" name="nombre" required>
    </p>
    <p>
    <label for="correo">Correo:</label> <input type="email" id="correo" name="correo" required>
    </p>
    <p>
    <label for="modelo">Modelo:</label> <select id="modelo" name="modelo">
    <option>Corolla</option>
    <option>Onix</option>
    <option>Sportage</option>
    </select>
    </p>
    <p>
    <label for="mensaje">Mensaje:</label>
    <br>
    <textarea id="mensaje" name="mensaje">
    </textarea>
    </p>
    <button type="submit">Enviar</button> <button type="reset">Limpiar</button>
    </form>
    <p>Formulario de demostración, sin servidor.</p>
</body>
</html>
