<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatos de texto - Venta de vehículos</title>
</head>
<body>
    <h1>Promociones</h1>
    <p>
    <strong>Oferta especial</strong> en vehículos seleccionados.</p>
    <p>
    <em>Financiamiento disponible.</em>
    </p>
    <p>Precio anterior: <del>$22 000</del> | Nuevo precio: <ins>$20 000</ins>
    </p>
    <p>
    <mark>Disponible</mark> <small>Precio ilustrativo.</small>
    </p>
    <p>Emisiones de CO<sub>2</sub> y espacio de carga en m<sup>3</sup>.</p>
</body>
</html>
